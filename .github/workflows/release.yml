# 发版工作流：tag 驱动的标准化发布（tag push → 校验 → 门禁 → Release → 预热 Go proxy）。
#
# Go 模块没有类似 npm 的中心发布市场：go get / go install 直接消费 git tag，
# proxy.golang.org（国内镜像 goproxy.cn）自动抓取缓存，pkg.go.dev 自动生成文档页。
# 因此"发布到包管理平台"= 打 tag + 建 GitHub Release + 主动预热公共代理并验证可安装。
#
# 用法：CHANGELOG.md 增加版本段落 → 合入 main → git tag vX.Y.Z && git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 祖先校验需要 main 与 tag 的完整历史
      - name: 校验 tag 为合法 SemVer
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 纯 shell 分解校验（POSIX case 通配），避免嵌套 ERE 在不同 bash 版本间行为不一致
          is_num() {  # 非空纯数字，无前导零（"0" 允许）
            case "$1" in
              ""|*[!0-9]*) return 1 ;;
              0)           return 0 ;;
              0*)          return 1 ;;
              *)           return 0 ;;
            esac
          }
          bad() { echo "::error::${TAG} 不是合法 SemVer（须形如 v1.2.3，可选先行号/构建号）：$1"; exit 1; }
          t="${TAG#v}"
          [ "$t" != "$TAG" ] && [ -n "$t" ] || bad "缺少 v 前缀"
          pre=""; build=""; had_pre=0; had_build=0
          if [[ "$t" == *+* ]]; then had_build=1; build="${t#*+}"; t="${t%%+*}"; fi
          if [[ "$t" == *-* ]]; then had_pre=1;   pre="${t#*-}";  t="${t%%-*}"; fi
          IFS='.' read -r maj min pat <<<"$t"
          is_num "$maj" || bad "主版本非法"
          is_num "$min" || bad "次版本非法"
          is_num "$pat" || bad "修订号非法"
          [ "$had_pre" -eq 0 ]   || { [ -n "$pre" ]   || bad "先行号为空"; }
          [ "$had_build" -eq 0 ] || { [ -n "$build" ] || bad "构建号为空"; }
          if [ -n "$pre" ]; then
            case "$pre" in *[!0-9A-Za-z-.]*) bad "先行号含非法字符" ;; esac
            case "$pre" in ""|.*|*.|*..*)    bad "先行号含空标识符" ;; esac
            for ident in ${pre//./ }; do
              case "$ident" in
                0*[0-9]*)
                  case "$ident" in
                    *[!0-9]*) : ;;  # 含字母/连字符，允许
                    *)         bad "纯数字先行号标识符不得有前导零" ;;
                  esac ;;
              esac
            done
          fi
          if [ -n "$build" ]; then
            case "$build" in *[!0-9A-Za-z-.]*) bad "构建号含非法字符" ;; esac
            case "$build" in ""|.*|*.|*..*)    bad "构建号含空标识符" ;; esac
          fi
          echo "✅ ${TAG} 为合法 SemVer"
      - name: 校验 go.mod module 路径与仓库一致
        run: |
          MODULE="$(sed -n 's/^module //p' go.mod)"
          EXPECTED="github.com/${GITHUB_REPOSITORY}"
          if [ "$MODULE" != "$EXPECTED" ]; then
            echo "::error::go.mod module=${MODULE} 与仓库 ${EXPECTED} 不一致，go get 将无法解析"
            exit 1
          fi
          echo "✅ module 路径 ${MODULE}"
      - name: 校验 tag 位于 main 历史上
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} 不在 main 分支历史上；从未合入 main 的提交不允许发版"
            exit 1
          fi
          echo "✅ tag 提交位于 main"
      - name: 校验 CHANGELOG 已含该版本段落
        run: |
          if ! grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 '## [${GITHUB_REF_NAME}]' 段落（Release 说明将截取该段落）"
            exit 1
          fi
          echo "✅ CHANGELOG 已含 ${GITHUB_REF_NAME} 段落"

  test:
    name: test gate (tag)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: make test-race

  acceptance:
    name: goldenset acceptance (tag)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Matrix + audit suites (race)
        run: go test -race -count=1 -timeout 900s ./acceptance/...
      - name: GoldenSet runner (thresholds)
        run: go run ./acceptance/cmd/runner -cases acceptance/goldenset/cases -out acceptance/report
      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-${{ github.ref_name }}
          path: acceptance/report/
          retention-days: 30

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [test, acceptance]
    permissions:
      contents: write  # gh release create/edit
    steps:
      - uses: actions/checkout@v4
      - name: 从 CHANGELOG 截取该版本段落作为发布说明
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="## [${TAG}]" '
            /^## \[/ { in_section = (index($0, tag) == 1); next }
            in_section { print }
          ' CHANGELOG.md > notes.raw.md
          # 去掉段落首尾空行；为空则说明段落缺失（validate 已挡，双保险）
          printf '%s\n' "$(cat notes.raw.md)" > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md 的 ${TAG} 段落为空"
            exit 1
          fi
      - name: 创建 GitHub Release（已存在则更新说明，保证幂等重跑）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # gh release view 会按"显示名"匹配到草稿：tag 被删重建后 GitHub 把
          # 旧 Release 转为无 tag 草稿，直接 edit 无法补 tag（真实踩坑）。
          # 因此按 tagName 精确判定：非草稿且 tag 匹配才走 edit，否则删除后重建。
          matched=$(gh release view "$TAG" -R "$REPO" --json tagName,isDraft \
            --jq 'select(.tagName == "'"${TAG}"'" and .isDraft == false) | .tagName' 2>/dev/null || true)
          if [ "$matched" = "$TAG" ]; then
            echo "Release ${TAG} 已存在，更新发布说明"
            gh release edit "$TAG" -R "$REPO" --notes-file notes.md
          else
            echo "未发现已发布的 ${TAG}（草稿/孤儿将清理），创建新 Release"
            gh release delete "$TAG" -R "$REPO" --yes 2>/dev/null || true
            gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" --notes-file notes.md
          fi
      - name: 下载本轮验收报告（acceptance job 产物）
        uses: actions/download-artifact@v4
        with:
          name: acceptance-report-${{ github.ref_name }}
          run-id: ${{ github.run_id }}
          path: acceptance-report
      - name: 附带验收报告到 Release（永久归档，替代 30 天过期的 workflow artifact）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # 统一命名前缀，幂等重跑（--clobber 覆盖同名资产）
          cd acceptance-report
          gh release upload "$TAG" -R "$REPO" report.md#kas-acceptance-report.md \
            report.json#kas-acceptance-report.json results.jsonl#kas-acceptance-results.jsonl --clobber
          echo "已附带资产："
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' 

  publish-go-proxy:
    name: warm go proxies + verify install
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: 预热公共 module proxy（使新版本立即可拉取）
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE="$(sed -n 's/^module //p' go.mod)"
          for proxy in https://proxy.golang.org https://goproxy.cn; do
            echo "→ 预热 ${proxy}"
            ( cd "$(mktemp -d)" && GOPROXY="${proxy},direct" go list -m "${MODULE}@${TAG}" )
          done
      - name: 请求 pkg.go.dev 刷新文档索引（非阻断）
        continue-on-error: true
        run: |
          MODULE="$(sed -n 's/^module //p' go.mod)"
          curl -fsS -X POST "https://pkg.go.dev/fetch/${MODULE}" \
            || echo "⚠️ pkg.go.dev fetch 未成功（proxy 预热后通常已自动索引），不阻断发布"
      - name: 消费者视角验证 go get 可安装并编译
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE="$(sed -n 's/^module //p' go.mod)"
          SCRATCH="$(mktemp -d)"
          cd "$SCRATCH"
          go mod init example.com/install-verify
          cat > main.go <<EOF
          package main

          import _ "${MODULE}"

          func main() {}
          EOF
          go get "${MODULE}@${TAG}"
          go build ./...
          echo "✅ ${MODULE}@${TAG} 已可被下游 go get 安装并编译（proxy.golang.org 已缓存）"
