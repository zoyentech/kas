# KAS 抓取配置（Story 8.7.1.1）：宿主应用暴露 /metrics（examples/metrics 演示 :8080）。
global:
  scrape_interval: 5s       # 本机诊断口径；生产建议 15~30s
  scrape_timeout: 3s
  external_labels:
    monitor: kas-local

scrape_configs:
  - job_name: kas
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"] # Linux 由 compose extra_hosts 映射
        labels:
          service: kas-host-app
